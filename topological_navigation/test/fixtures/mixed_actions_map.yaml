meta:
  last_updated: 25-02-2026_00-00-00
  origin:
    latitude: 0.0
    longitude: 0.0
    altitude: 0.0

metric_map: mixed_test_map
name: mixed_test_map
pointset: mixed_test_map

# All nodes default to topological_frame_id ("mixed_test_map")
transformation:
  topological_frame_id: mixed_test_map
  parent: map
  rotation:
    w: 1.0
    x: 0.0
    y: 0.0
    z: 0.0
  translation:
    x: 0.0
    y: 0.0
    z: 0.0

definitions:
  default_bt: |
    <root main_tree_to_execute="MainTree">
      <BehaviorTree ID="MainTree">
        <RecoveryNode number_of_retries="6" name="NavigateRecovery">
          <PipelineSequence name="NavigateWithReplanning">
            <RateController hz="1.0">
              <RecoveryNode number_of_retries="1" name="ComputePathToPose">
                <ComputePathToPose goal="{goal}" path="{path}" planner_id="GridBased"/>
                <ReactiveFallback name="ComputePathToPoseRecoveryFallback">
                  <GoalUpdated/>
                  <ClearEntireCostmap name="ClearGlobalCostmap-Context" service_name="global_costmap/clear_entirely_global_costmap"/>
                </ReactiveFallback>
              </RecoveryNode>
            </RateController>
            <RecoveryNode number_of_retries="1" name="FollowPath">
              <FollowPath path="{path}" controller_id="FollowPath"/>
              <ReactiveFallback name="FollowPathRecoveryFallback">
                <GoalUpdated/>
                <ClearEntireCostmap name="ClearLocalCostmap-Context" service_name="local_costmap/clear_entirely_local_costmap"/>
              </ReactiveFallback>
            </RecoveryNode>
          </PipelineSequence>
          <ReactiveFallback name="RecoveryFallback">
            <GoalUpdated/>
            <RoundRobin name="RecoveryActions">
              <Sequence name="ClearingActions">
                <ClearEntireCostmap name="ClearLocalCostmap-Subtree" service_name="local_costmap/clear_entirely_local_costmap"/>
                <ClearEntireCostmap name="ClearGlobalCostmap-Subtree" service_name="global_costmap/clear_entirely_global_costmap"/>
              </Sequence>
              <Spin spin_dist="1.57"/>
              <Wait wait_duration="5"/>
              <BackUp backup_dist="0.15" backup_speed="0.025"/>
            </RoundRobin>
          </ReactiveFallback>
        </RecoveryNode>
      </BehaviorTree>
    </root>
  goal_align_bt: |
    <root main_tree_to_execute="MainTree">
      <BehaviorTree ID="MainTree">
        <RecoveryNode number_of_retries="6" name="NavigateRecovery">
          <PipelineSequence name="NavigateWithReplanning">
            <RateController hz="1.0">
              <RecoveryNode number_of_retries="1" name="ComputePathToPose">
                <ComputePathToPose goal="{goal}" path="{path}" planner_id="GridBased"/>
                <ReactiveFallback name="ComputePathToPoseRecoveryFallback">
                  <GoalUpdated/>
                  <ClearEntireCostmap name="ClearGlobalCostmap-Context" service_name="global_costmap/clear_entirely_global_costmap"/>
                </ReactiveFallback>
              </RecoveryNode>
            </RateController>
            <RecoveryNode number_of_retries="1" name="FollowPath">
              <FollowPath path="{path}" controller_id="FollowPath"/>
              <ReactiveFallback name="FollowPathRecoveryFallback">
                <GoalUpdated/>
                <ClearEntireCostmap name="ClearLocalCostmap-Context" service_name="local_costmap/clear_entirely_local_costmap"/>
              </ReactiveFallback>
            </RecoveryNode>
          </PipelineSequence>
          <ReactiveFallback name="RecoveryFallback">
            <GoalUpdated/>
            <RoundRobin name="RecoveryActions">
              <Sequence name="ClearingActions">
                <ClearEntireCostmap name="ClearLocalCostmap-Subtree" service_name="local_costmap/clear_entirely_local_costmap"/>
                <ClearEntireCostmap name="ClearGlobalCostmap-Subtree" service_name="global_costmap/clear_entirely_global_costmap"/>
              </Sequence>
              <Wait wait_duration="5"/>
              <BackUp backup_dist="0.15" backup_speed="0.025"/>
            </RoundRobin>
          </ReactiveFallback>
        </RecoveryNode>
      </BehaviorTree>
    </root>
  row_traversal_bt: |
    <root main_tree_to_execute="MainTree">
      <BehaviorTree ID="MainTree">
        <RecoveryNode number_of_retries="0" name="NavigateRecovery">
          <PipelineSequence name="NavigateWithReplanning">
            <RateController hz="0.333">
              <RecoveryNode number_of_retries="0" name="ComputePathThroughPoses">
                <ReactiveSequence>
                  <RemovePassedGoals input_goals="{goals}" output_goals="{goals}" radius="1.5"/>
                  <ComputePathThroughPoses goals="{goals}" path="{path}" planner_id="GridBased"/>
                </ReactiveSequence>
                <ReactiveFallback name="ComputePathThroughPosesRecoveryFallback">
                  <GoalUpdated/>
                  <ClearEntireCostmap name="ClearGlobalCostmap-Context" service_name="global_costmap/clear_entirely_global_costmap"/>
                </ReactiveFallback>
              </RecoveryNode>
            </RateController>
            <RecoveryNode number_of_retries="0" name="FollowPath">
              <FollowPath path="{path}" controller_id="FollowPath"/>
              <ReactiveFallback name="FollowPathRecoveryFallback">
                <GoalUpdated/>
                <ClearEntireCostmap name="ClearLocalCostmap-Context" service_name="local_costmap/clear_entirely_local_costmap"/>
              </ReactiveFallback>
            </RecoveryNode>
          </PipelineSequence>
          <ReactiveFallback name="RecoveryFallback">
            <GoalUpdated/>
            <RoundRobin name="RecoveryActions">
              <Sequence name="ClearingActions">
                <ClearEntireCostmap name="ClearLocalCostmap-Subtree" service_name="local_costmap/clear_entirely_local_costmap"/>
                <ClearEntireCostmap name="ClearGlobalCostmap-Subtree" service_name="global_costmap/clear_entirely_global_costmap"/>
              </Sequence>
              <Wait wait_duration="5"/>
              <BackUp backup_dist="0.15" backup_speed="0.025"/>
            </RoundRobin>
          </ReactiveFallback>
        </RecoveryNode>
      </BehaviorTree>
    </root>

actions:
  navigate_to_pose:
    composable: false
    action_type: nav2_msgs.action.NavigateToPose
    action_server: /navigate_to_pose
    action_goal_template:
      pose: '${node.pose}'
      behavior_tree: '${definitions.default_bt}'
  goal_align:
    composable: false
    action_type: nav2_msgs.action.NavigateToPose
    action_server: /navigate_to_pose
    action_goal_template:
      pose: '${node.pose}'
      behavior_tree: '${definitions.goal_align_bt}'
  row_traversal:
    composable: true
    action_type: nav2_msgs.action.NavigateThroughPoses
    action_server: /navigate_through_poses
    action_goal_template:
      poses: ['${node.pose}']
      behavior_tree: '${definitions.row_traversal_bt}'

nodes:
  # N1 -- navigate_to_pose --> N2 -- navigate_to_pose --> N3
  # N3 -- row_traversal    --> N4 -- row_traversal    --> N5
  # N5 -- goal_align       --> N6

  - meta:
      map: mixed_test_map
      node: N1
      pointset: mixed_test_map
    node:
      edges:
        - action: navigate_to_pose
          edge_id: N1_N2
          node: N2
          properties:
            max_speed: 0.5
      name: N1
      pose:
        orientation:
          w: 1.0
          x: 0.0
          y: 0.0
          z: 0.0
        position:
          x: 0.0
          y: 0.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.3
        yaw_goal_tolerance: 0.1
      verts:
        - x: -1.0
          y: -1.0
        - x: 1.0
          y: -1.0
        - x: 1.0
          y: 1.0
        - x: -1.0
          y: 1.0

  - meta:
      map: mixed_test_map
      node: N2
      pointset: mixed_test_map
    node:
      edges:
        - action: navigate_to_pose
          edge_id: N2_N3
          node: N3
          properties:
            max_speed: 0.5
        - action: navigate_to_pose
          edge_id: N2_N1
          node: N1
          properties:
            max_speed: 0.5
      name: N2
      pose:
        orientation:
          w: 1.0
          x: 0.0
          y: 0.0
          z: 0.0
        position:
          x: 3.0
          y: 0.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.3
        yaw_goal_tolerance: 0.1
      verts:
        - x: -1.0
          y: -1.0
        - x: 1.0
          y: -1.0
        - x: 1.0
          y: 1.0
        - x: -1.0
          y: 1.0

  - meta:
      map: mixed_test_map
      node: N3
      pointset: mixed_test_map
    node:
      edges:
        - action: row_traversal
          edge_id: N3_N4
          node: N4
          properties:
            boundary_left: 0.4
            boundary_right: 0.6
        - action: navigate_to_pose
          edge_id: N3_N2
          node: N2
          properties:
            max_speed: 0.5
      name: N3
      pose:
        orientation:
          w: 1.0
          x: 0.0
          y: 0.0
          z: 0.0
        position:
          x: 6.0
          y: 0.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.1
        yaw_goal_tolerance: 0.05
      verts:
        - x: -0.5
          y: -0.5
        - x: 0.5
          y: -0.5
        - x: 0.5
          y: 0.5
        - x: -0.5
          y: 0.5

  - meta:
      map: mixed_test_map
      node: N4
      pointset: mixed_test_map
    node:
      edges:
        - action: row_traversal
          edge_id: N4_N5
          node: N5
          properties:
            boundary_left: 0.4
            boundary_right: 0.6
        - action: row_traversal
          edge_id: N4_N3
          node: N3
          properties:
            boundary_left: 0.4
            boundary_right: 0.6
      name: N4
      pose:
        orientation:
          w: 1.0
          x: 0.0
          y: 0.0
          z: 0.0
        position:
          x: 9.0
          y: 0.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.1
        yaw_goal_tolerance: 0.05
      verts:
        - x: -0.5
          y: -0.5
        - x: 0.5
          y: -0.5
        - x: 0.5
          y: 0.5
        - x: -0.5
          y: 0.5

  - meta:
      map: mixed_test_map
      node: N5
      pointset: mixed_test_map
    node:
      edges:
        - action: goal_align
          edge_id: N5_N6
          node: N6
          properties:
            precision: true
        - action: row_traversal
          edge_id: N5_N4
          node: N4
          properties:
            boundary_left: 0.4
            boundary_right: 0.6
      name: N5
      pose:
        orientation:
          w: 0.707
          x: 0.0
          y: 0.0
          z: 0.707
        position:
          x: 12.0
          y: 0.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.05
        yaw_goal_tolerance: 0.02
      verts:
        - x: -0.5
          y: -0.5
        - x: 0.5
          y: -0.5
        - x: 0.5
          y: 0.5
        - x: -0.5
          y: 0.5

  - meta:
      map: mixed_test_map
      node: N6
      pointset: mixed_test_map
    node:
      edges:
        - action: goal_align
          edge_id: N6_N5
          node: N5
          properties:
            precision: true
      name: N6
      nav_frame: map  # override: use 'map' instead of topological_frame_id
      pose:
        orientation:
          w: 0.707
          x: 0.0
          y: 0.0
          z: 0.707
        position:
          x: 15.0
          y: 0.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.05
        yaw_goal_tolerance: 0.02
      verts:
        - x: -0.5
          y: -0.5
        - x: 0.5
          y: -0.5
        - x: 0.5
          y: 0.5
        - x: -0.5
          y: 0.5
