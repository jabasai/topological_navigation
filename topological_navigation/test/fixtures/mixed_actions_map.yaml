meta:
  last_updated: 01-01-2026_00-00-00
  origin:
    latitude: 0.0
    longitude: 0.0
    altitude: 0.0

metric_map: mixed_test_map
name: mixed_test_map
pointset: mixed_test_map

transformation:
  child: mixed_test_map
  parent: map
  rotation:
    w: 1.0
    x: 0.0
    y: 0.0
    z: 0.0
  translation:
    x: 0.0
    y: 0.0
    z: 0.0

nodes:
