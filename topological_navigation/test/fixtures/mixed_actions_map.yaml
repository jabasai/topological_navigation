  - meta:
      map: mixed_test_map
      node: N1
      pointset: mixed_test_map
    node:
      edges:
        - action: NavigateToPose
          action_type: nav2_msgs/action/NavigateToPose
          edge_id: N1_N2
          node: N2
          fail_policy: retry_2,fail
          goal:
            target_pose:
              header:
                frame_id: $node.parent_frame
              pose: $node.pose
          properties:
            max_speed: 0.5
      localise_by_topic: ''
      name: N1
      parent_frame: map
      pose:
        orientation:
          w: 1.0
          x: 0.0
          y: 0.0
          z: 0.0
        position:
          x: 0.0
          y: 0.0
          z: 0.0
      properties:
        xy_goal_tolerance: 0.3
        yaw_goal_tolerance: 0.1
      verts:
        - x: -1.0
          y: -1.0
        - x: 1.0
          y: -1.0
        - x: 1.0
          y: 1.0
        - x: -1.0
          y: 1.0

